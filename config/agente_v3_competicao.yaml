# Agentes v3/v4 — competição de 16 a 20/11/2026 contra os agentes antigos.
# Origem: grade de 11.844 estratégias (backtest/agentes_v3/grid.py, custo real de ticks em GOLD/BTC),
# 77 aprovadas nos 5 critérios; finalistas analisados em backtest/agentes_v3/finalistas.py.
# 14/11: exigência de acerto >= 60% -> grade v4 (backtest/agentes_v3/grid4.py), +56.448 estratégias com saídas por
# alvo; 45 aprovadas (GOLD 18, US500 27, BTC 0 nos 6 critérios). Os 5 agentes v4 abaixo substituem os v3 na competição.
# Código: agents/v3_agent.py (mesmas regras do backtest) + agents/v3_signals.py. Processo: start_v3.bat.
# Guardas FIXAS no código: só DEMO, 1 posição por agente, magic exclusivo. Aqui: limite de perda por agente
# (zera e desliga, gravado em state/<nome>.json), kill_switch (relido a cada 60 s) e spread máximo de entrada.

risco:                                     # 15/11: proteção de capital de TODOS os agentes deste arquivo (agents/v3_risk.py)
  max_risco_trade_pct: 5.0                 # stop de uma entrada <= 5% da equity (senão a entrada é pulada)
  max_risco_aberto_pct: 10.0               # soma dos stops de TODAS as posições da conta + esta <= 10% da equity
  um_por_direcao: true                     # no máximo 1 posição por ativo e direção entre estes agentes
  perda_diaria_pct: 6.0                    # perda do dia (realizado + flutuante da conta) >= 6% -> sem novas entradas

competicao:
  inicio_utc: "2026-11-16 00:00"          # segunda
  fim_utc: "2026-11-21 00:00"             # inclui a sexta inteira
  antigos: ["engine A2", "engine A3", "goldflip", "sweep48", "rsi20", "goldnight_v2"]
  novos: ["v4_gold_rsipb_m5", "v4_gold_rsix_m5", "v4_us500_st_h1", "v4_us500_bb_h1", "v4_btc_rsipb_h1",
          "of_btc_01_rsipb_conf_w1",
          "of_btc_02_rsipb_conf_w1",
          "of_btc_03_chan_dz_agree",
          "of_btc_04_st_dz_agree",
          "of_btc_05_chan_delta_agree",
          "of_btc_06_chan_dz_agree",
          "of_btc_07_st_dz_agree",
          "of_btc_08_bb_dz_agree",
          "of_btc_09_rsipb_exh_w1",
          "of_btc_10_chan_veto_cvd",
